[labels]
app.name = මෙනුව

# Error messages used by a.error.label(...). Generated keys mirror
# the previous hardcoded a.error() literals.
errors.id_is_required = id අවශ්‍යයි
errors.app_is_required = app අවශ්‍යයි
errors.invalid_id = වලංගු නොවන id
errors.not_found = සොයාගත නොහැකි විය
errors.push_notifications_not_available = Push දැනුම්දීම් ලබා ගත නොහැක
errors.type_is_required = වර්ගය අවශ්‍යයි
errors.app_and_permission_are_required = app සහ අවසර අවශ්‍යයි
errors.restricted_permissions_disabled = සීමිත අවසර app සැකසුම්වල සක්‍රීය කළ යුතුය
errors.invalid_subscription = අවලංගු push දායකත්වය
errors.registration_failed = Push ලියාපදිංචිය අසාර්ථකයි
errors.inbound_not_implemented = පැමිණෙන push අවසන් ලක්ෂ්‍යය තවම ක්‍රියාත්මක කර නැත
errors.permission_is_required = අවසරයක් අවශ්‍ය වේ
